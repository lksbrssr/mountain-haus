# Fly.io config for the Haus comments backend.
# Deploy steps are in README.md. App name must be globally unique — change it
# here (and in the frontend NEXT_PUBLIC_COMMENTS_API) if this one is taken.
app = "haus-am-see-comments"
primary_region = "fra"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "haus_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
